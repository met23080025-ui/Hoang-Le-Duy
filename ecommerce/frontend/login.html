<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - ShopEase</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-container">
  <div class="auth-box">
    <div class="logo">🛍️ ShopEase</div>
    <h2>Welcome Back</h2>
    <form id="login-form">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="Enter your email" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>
    <p style="text-align:center; margin-top:1rem; color:#64748b;">
      Don't have an account? <a href="/register.html" style="color:#2563eb;">Register</a>
    </p>
    <p style="text-align:center; margin-top:0.5rem; font-size:0.85rem; color:#94a3b8;">
      Demo: admin@shop.com / password
    </p>
  </div>
</div>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>

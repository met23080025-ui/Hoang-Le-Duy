<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Orders - ShopEase</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="logo">🛍️ ShopEase</div>
    <ul>
      <li><a href="/admin/dashboard.html">📊 Dashboard</a></li>
      <li><a href="/admin/products.html">📦 Products</a></li>
      <li><a href="/admin/orders.html" class="active">🧾 Orders</a></li>
      <li><a href="/">🏠 Store</a></li>
      <li><a href="#" onclick="logout()">🚪 Logout</a></li>
    </ul>
  </aside>

  <main class="admin-main">
    <div class="admin-header">
      <h1>Manage Orders</h1>
    </div>

    <table class="data-table">
      <thead>
        <tr><th>ID</th><th>Customer</th><th>Products</th><th>Total</th><th>Address</th><th>Status</th><th>Date</th></tr>
      </thead>
      <tbody id="orders-table"></tbody>
    </table>
  </main>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script>
  if (!isAdmin()) window.location.href = '/login.html';

  async function loadOrders() {
    const orders = await api.get('/orders/all');
    document.getElementById('orders-table').innerHTML = orders.map(o => `
      <tr>
        <td>#${o.id}</td>
        <td>${o.user_name}<br><small style="color:#64748b">${o.email}</small></td>
        <td style="max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${o.products || '-'}</td>
        <td>$${parseFloat(o.total).toFixed(2)}</td>
        <td style="max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${o.address}</td>
        <td>
          <select onchange="updateStatus(${o.id}, this.value)" style="padding:0.3rem; border:1px solid #e2e8f0; border-radius:4px;">
            ${['pending','processing','shipped','delivered','cancelled'].map(s =>
              `<option value="${s}" ${o.status === s ? 'selected' : ''}>${s}</option>`
            ).join('')}
          </select>
        </td>
        <td>${new Date(o.created_at).toLocaleDateString()}</td>
      </tr>
    `).join('');
  }

  async function updateStatus(id, status) {
    await api.put(`/orders/${id}/status`, { status });
    showToast('Status updated');
  }

  loadOrders();
</script>
</body>
</html>
